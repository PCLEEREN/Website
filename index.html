<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Cleeren.tv</title>
  <style>
    :root {
      --primary: #1e293b;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #334155;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .logo {
      max-width: 160px;
      height: auto;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    .contact-item {
      display: flex;
      flex-direction: column;
    }
    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      font-weight: 600;
    }
    .value {
      font-size: 1rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .value:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="card">
    
<img src="https://lh3.googleusercontent.com/d/1SvQrnTnRukZV2_tz0vYzUAuYET5V1RCl" alt="Logo Cleeren.tv" class="logo">
    
    <h1>Cleeren.tv Comm. V</h1>
    <p class="subtitle">Neem gerust contact met ons op</p>

    <div class="contact-info">
      <div class="contact-item">
        <span class="label">E-mailadres</span>
        <a href="mailto:pieter@cleeren.tv" class="value">pieter@cleeren.tv</a>
      </div>

      <div class="contact-item">
        <span class="label">Telefoon</span>
        <a href="tel:+3200000000" class="value">+32 (0)0 000 00 00</a>
      </div>

      <div class="contact-item">
        <span class="label">Locatie</span>
        <span class="value">Brugge, België</span>
      </div>
    </div>
  </div>

</body>
</html>
